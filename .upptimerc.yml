status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: status.mightora.io
  # baseUrl: /your-repo-name
  logoUrl: https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png
  favicon: https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightora-io-swirl.png
  name: Mightora Status
  introTitle: "**Mightora** service status"
  introMessage: "Live availability, response-time trends and incident history. Browse by tool type, select a service for its history, or choose Open tool to visit it directly."
  themeUrl: https://status.mightora.io/mightora-theme.css
  hideNavLogo: true
  hideNavTitle: true
  customHeadHtml: |
    <meta name="description" content="Live uptime, response-time trends, and incident history for services monitored by Mightora.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://status.mightora.io/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Mightora">
    <meta property="og:title" content="Mightora Service Status">
    <meta property="og:description" content="Live uptime, response-time trends, and incident history for services monitored by Mightora.">
    <meta property="og:url" content="https://status.mightora.io/">
    <meta property="og:image" content="https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightora-io-swirl.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Mightora Service Status">
    <meta name="twitter:description" content="Live uptime, response-time trends, and incident history for services monitored by Mightora.">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Mightora Service Status",
      "url": "https://status.mightora.io/",
      "description": "Live uptime, response-time trends, and incident history for services monitored by Mightora.",
      "publisher": {
        "@type": "Organization",
        "name": "Mightora",
        "url": "https://mightora.io/"
      }
    }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/mightora/shared-ui@main/shared.css">
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mightora/shared-ui@main/components.js" defer></script>
    <script src="https://status.mightora.io/status-groups.js" defer></script>
  customBodyHtml: |
    <mightora-header
      site-name="Mightora Status"
      site-url="/"
      logo-light="https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png"
      logo-dark="https://raw.githubusercontent.com/mightora/mightora.io/main/static/images/mightoraIoLogo4-200x900.png"
      theme-key="mightora-status-theme"
      nav-links='[{"label":"Status","url":"/"},{"label":"Mightora.io ↗","url":"https://mightora.io","ext":true}]'>
    </mightora-header>
  customFootHtml: |
    <section class="mightora-status-trust" aria-label="Open-source project information">
      <p>Mightora Status is open source. You can inspect its monitoring configuration, code and GitHub Actions results independently.</p>
      <div class="mightora-status-badges">
        <a href="https://github.com/mightora/status/actions/workflows/uptime.yml" target="_blank" rel="noopener noreferrer"><img loading="lazy" alt="Uptime CI workflow status" src="https://github.com/mightora/status/actions/workflows/uptime.yml/badge.svg"></a>
        <a href="https://github.com/mightora/status/actions/workflows/site.yml" target="_blank" rel="noopener noreferrer"><img loading="lazy" alt="Static site deployment workflow status" src="https://github.com/mightora/status/actions/workflows/site.yml/badge.svg"></a>
        <a href="https://github.com/mightora/status/actions/workflows/status-catalog-check.yml" target="_blank" rel="noopener noreferrer"><img loading="lazy" alt="Service catalogue automated tests" src="https://github.com/mightora/status/actions/workflows/status-catalog-check.yml/badge.svg"></a>
        <a href="https://github.com/mightora/status/blob/master/LICENSE" target="_blank" rel="noopener noreferrer"><img loading="lazy" alt="MIT open-source licence" src="https://img.shields.io/badge/licence-MIT-blue"></a>
        <a href="https://github.com/mightora/status" target="_blank" rel="noopener noreferrer"><img loading="lazy" alt="Public GitHub source repository" src="https://img.shields.io/badge/source-GitHub-informational?logo=github"></a>
      </div>
    </section>
    <mightora-author>
      <div class="author-section-overlay">
        <div class="author-section-inner">
          <div class="author-photos">
            <img src="https://techtweedie.github.io/images/author/ian-tweedie-sq2_hu_a380911c6f4726de.png" alt="Ian Tweedie" class="author-avatar">
            <img src="https://raw.githubusercontent.com/TechTweedie/techtweedie.github.io/v2/assets/images/site/main-logo.png" alt="TechTweedie blog" class="author-blog-logo">
          </div>
          <div class="author-text">
            <h2 class="author-heading">Built by TechTweedie</h2>
            <p class="author-bio">Mightora Status is an open-source monitoring dashboard maintained by <strong>Ian Tweedie</strong>, also known as <strong>TechTweedie</strong>. Ian is a technology consultant and developer based in North East England, creating free tools for developers and technology professionals.</p>
            <div class="author-links">
              <a href="https://techtweedie.github.io" target="_blank" rel="noopener noreferrer" class="author-link">Blog</a>
              <a href="https://github.com/itweedie" target="_blank" rel="noopener noreferrer" class="author-link">GitHub</a>
            </div>
          </div>
        </div>
      </div>
    </mightora-author>
    <mightora-footer yaml-url="https://cdn.jsdelivr.net/gh/mightora/shared-ui@main/footer.yaml">
      <div class="container">
        <div class="footer-bottom">
          <div class="footer-copy">&copy; <span class="footer-year"></span> Mightora. All rights reserved.</div>
          <div class="footer-bottom-links">
            <a href="https://github.com/mightora/status">GitHub</a>
          </div>
        </div>
      </div>
    </mightora-footer>
  navbar:
    - title: Status
      href: /
    - title: Mightora.io
      href: https://mightora.io

