name: Status catalogue checks

on:
  push:
    paths:
      - '.upptimerc.yml'
      - 'assets/status-groups.js'
      - 'assets/mightora-theme.css'
      - 'tests/status-catalog.test.cjs'
      - '.github/workflows/status-catalog-check.yml'
  pull_request:
    paths:
      - '.upptimerc.yml'
      - 'assets/status-groups.js'
      - 'assets/mightora-theme.css'
      - 'tests/status-catalog.test.cjs'
      - '.github/workflows/status-catalog-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check assets/status-groups.js
      - name: Verify monitors, public links and categories
        run: node --test tests/status-catalog.test.cjs
